name: Deploy website to nogues.app/art

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nogues-app-art
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static website
        run: pnpm run build

      - name: Deploy dist/public to nogues.app/art
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          # Secrets SFTP OVH configurés dans le dépôt.
          server: ${{ secrets.OVH_SFTP_HOST }}
          username: ${{ secrets.OVH_SFTP_USER }}
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          port: 22
          local_path: ./dist/public/*
          # Sur l’hébergement mutualisé OVH, le DocumentRoot est ./www/.
          remote_path: ./www/art/
          # Conserve les fichiers non gérés par le site et évite toute suppression destructive.
          delete_remote_files: false
          sftpArgs: '-o ConnectTimeout=15'
