name: Deploy website to nogues.app/art

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nogues-app-art
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static website
        run: pnpm run build

      - name: Install the SFTP client
        run: sudo apt-get update -qq && sudo apt-get install --yes --quiet sshpass

      - name: Create the OVH web target when needed
        env:
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
        run: |
          # Les erreurs « already exists » sont attendues sur les dossiers persistants.
          {
            echo "mkdir www"
            echo "mkdir www/art"
            echo "quit"
          } | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 \
              -P 22 "${SFTP_USER}@${SFTP_HOST}" || true

      - name: Deploy dist/public to nogues.app/art
        env:
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
        run: |
          set -euo pipefail
          {
            echo "put -r dist/public/* www/art/"
            echo "quit"
          } | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 \
              -P 22 "${SFTP_USER}@${SFTP_HOST}"
